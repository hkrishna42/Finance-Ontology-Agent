# Firm Ontology Platform — full containerized stack (stub mode by default).
#
#   neo4j  graph + native 384-d vector index (Community)
#   api    FastAPI + SSE; restores the committed snapshot on first boot (see api/snapshot.py)
#   web    nginx serving the built SPA + same-origin reverse proxy to `api` (docker/nginx.conf)
#
# Bring-up (both gate on health):
#   stub  (default) : docker compose up --build --wait      → open http://localhost:5173
#   full            : docker compose -f docker-compose.yml -f docker-compose.full.yml up --build --wait
#   prebuilt (GHCR) : docker compose -f docker-compose.yml -f docker-compose.prebuilt.yml up --wait
#
# `make bootstrap` / `make bootstrap MODE=full` wrap these. The base file reads NO .env, so stub is
# fully offline on a clean machine; the full overlay is the only thing that injects the API key.
name: firm-ontology

services:
  neo4j:
    # Pinned by digest for reproducibility (tag kept for readability).
    image: neo4j:5.26-community@sha256:362542416de6c09a971484d1893878016cc3b5cdec166e54b1c824a220ecd6b9
    environment:
      NEO4J_AUTH: neo4j/firmontology
      # Modest footprint for a laptop POC.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP / Browser (neo4j / firmontology)
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Ready only once Bolt answers a query (not merely when the port opens).
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p firmontology 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${API_IMAGE:-firm-ontology-api:local}
    environment:
      # Stub defaults are baked into the image too; set here so `docker compose config` shows the
      # effective mode and the full overlay has a single place to override.
      PROVIDER_MODE: stub
      EMBED_BACKEND: hash
      NEO4J_URI: bolt://neo4j:7687      # service DNS — NOT localhost (in-container)
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: firmontology
      SQLITE_PATH: /app/data/app.db
    volumes:
      - api_data:/app/data              # persist SQLite app-state across restarts
    depends_on:
      neo4j:
        condition: service_healthy
    # No host port: the API is internal; the web service reverse-proxies every endpoint to it.
    # (Uncomment to curl it directly during dev.)
    # ports: ["${API_PORT:-8000}:8000"]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ${WEB_IMAGE:-firm-ontology-web:local}
    ports:
      - "${WEB_PORT:-5173}:80"          # open this in a browser
    depends_on:
      api:
        condition: service_healthy

volumes:
  neo4j_data:
  api_data:
