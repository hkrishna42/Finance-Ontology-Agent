# nginx: serve the built React SPA and reverse-proxy the API on the same origin, so the web app's
# relative fetch()/EventSource calls (e.g. `/graph`, `/ingest/demo/stream`) reach the api service
# with no CORS and no absolute URLs. SSE streams are proxied unbuffered so events flush live.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

upstream api_upstream {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable static compression for the SPA bundle.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API reverse proxy ---------------------------------------------------------------------
    # Every backend surface the UI talks to. The (/|$) boundary means only these exact path
    # segments proxy — static assets like /assets/*.js still fall through to the SPA handler below.
    location ~ ^/(health|ontology|graph|documents|risk|impact|reports|firms|resolve|query|ingest|eval)(/|$) {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-friendly: never buffer, never cache, hold the stream open, keep the upstream socket.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_request_buffering    off;
        chunked_transfer_encoding  off;
        proxy_set_header Connection "";
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
    }

    # --- SPA fallback --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell (so a redeploy is picked up); hashed assets are immutable.
    location = /index.html { add_header Cache-Control "no-store"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
