    issuer: NVIDIA
    cik: "0001045810"
    form: 10-K
    sections: [1, 1A, 7]
    mode: pre_ingest
    accession: null
    sha256: null
  - id: amd_10k
    issuer: AMD
    form: 10-K
    sections: [1, 1A, 7]
    mode: pre_ingest
    accession: null
    sha256: null
  - id: tsmc_20f
    issuer: TSMC
    form: 20-F
    sections: [1, 1A, 7]
    mode: pre_ingest
    accession: null
    sha256: null
  - id: asml_20f
    issuer: ASML
    form: 20-F
    sections: [1A]
    mode: pre_ingest
    accession: null
