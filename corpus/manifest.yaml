# Corpus manifest — the pinned, reproducible input set.
# accession + sha256 are filled at build time by scripts/pin_manifest.py (edgartools), so every
# clone ingests byte-identical inputs. Fund identifiers below were GLEIF-verified.
edgar_user_agent: "Example Firm Research contact@example.com"

firm:
  name: "Demo Investment Management"

funds:
  - name: "Demo Growth Fund"
    role: primary
    lei: "DEMOGROWTHFUND000001"      # GLEIF-verified
    series_id: "S000090001"           # GLEIF registeredAs
    registrant_cik: "0009000001"      # Demo Portfolios Inc. — verify via series at build
    tickers: [DGFAX, DGFCX, DGFZX, DGFQX]
    benchmark: "Russell 1000 Growth"
  - name: "Demo Focused Growth Fund"
    role: secondary
    lei: "DEMOFOCUSEDGRWTH0001"       # GLEIF-verified
    series_id: "S000090002"           # GLEIF registeredAs
    registrant_cik: "0009000002"      # Demo Portfolios 3 — verify at build
    tickers: [DFGAX, DFGCX, DFGZX]
    concentration: "concentrated (~25-35 holdings)"

# (disambiguation handled at onboarding time)

# section filters: 10-K/20-F -> Items 1,1A,7 ; proxy -> governance/bios ; prospectus -> principal risks
documents:
